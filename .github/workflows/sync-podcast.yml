name: Sync podcast from RSS

# Keeps the site's podcast section in sync with the RSS feed.
# - schedule: runs automatically once a week
# - workflow_dispatch: adds a "Run workflow" button for manual triggering
# It only syncs metadata/episodes (title, intro, cover, show notes). Transcripts
# are generated locally with Whisper and are preserved by the sync script.
on:
  schedule:
    - cron: "0 8 * * 1"   # every Monday 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync from RSS
        run: python3 scripts/sync_podcast.py

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/podcast_channel.yml _podcast assets/img/podcast/cover.jpg
          if git diff --cached --quiet; then
            echo "No podcast changes."
          else
            git commit -m "chore: sync podcast from RSS [skip ci]"
            git push
          fi
